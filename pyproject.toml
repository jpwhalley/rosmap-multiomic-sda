# Project metadata for the g_ros release.
#
# Three install paths are supported (see README.md for details):
#   1. uv sync                         (fast, hash-pinned via uv.lock; recommended)
#   2. conda env create -f environment.yml
#   3. pip install -e .                (plain pip from this file; loose pins)
#
# The helper module `g_ros_release.py` lives next to this file; setuptools
# discovers it via the `py-modules` entry below.

[project]
name = "g-ros"
version = "2.0.1"
description = "Analysis code for Whalley J.P. et al., 'Multi-omic Analysis of Sex and Alzheimer's Disease in the Aged Human Cortex' (under review at npj Aging). Notebooks reproduce the per-component panels, KEGG enrichment, and clinical-association tests from the deposited 547-component ROSMAP SDA decomposition; scripts/ holds the pipeline, the analyses and the figure code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Justin Whalley", email = "justin.whalley@rosalindfranklin.edu" },
]
keywords = [
    "rosmap",
    "sda",
    "multi-omic",
    "alzheimers",
    "aging",
    "neuroscience",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # Core scientific stack
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
    "seaborn",

    # Jupyter (for the notebooks)
    "jupyter",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
    "tqdm",

    # Specialty plotting helpers used by Notebook 01
    "adjustText",
    "brokenaxes",

    # KEGG enrichment used by Notebook 02
    "gseapy",

    # Programmatic Synapse downloads (so users can fetch the deposit
    # without leaving Python)
    "synapseclient",
]

[project.urls]
Repository    = "https://github.com/jpwhalley/rosmap-multiomic-sda"
"Bug Tracker" = "https://github.com/jpwhalley/rosmap-multiomic-sda/issues"
# Manuscript DOI will be filled in on publication. Preprint (earlier version): doi:10.1101/2025.10.10.681695.
# Data deposit: Synapse syn75275226 (version 2).

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["g_ros_release"]
